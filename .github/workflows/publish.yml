name: publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: lint
        shell: bash
        run: yarn lint

      - name: run unit tests
        shell: bash
        run: yarn test

      - name: build
        uses: ./.github/actions/build

      - name: run e2e tests
        uses: ./.github/actions/e2e-test
        env:
          E2E_PAT: ${{ secrets.E2E_PAT }}

  publish_firefox:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: build firefox
        shell: bash
        run: yarn build:firefox

      - name: Publish firefox
        run: |
          yarn web-ext sign \
            --source-dir "build/firefox-mv3-prod" \
            --api-key "${{ secrets.FIREFOX_STORE_JWT_ISSUER }}" \
            --api-secret "${{ secrets.FIREFOX_STORE_JWT_SECRET }}" \
            --channel "listed"

  publish_chrome:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: build chrome
        shell: bash
        run: yarn build:chrome

      - name: Publish Chrome
        env:
          CLIENT_ID: ${{ secrets.CHROME_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_STORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_STORE_PUBLISHER_ID }}
        run: |
          yarn chrome-webstore-upload \
            --source "build/chrome-mv3-prod" \
            --extension-id "${{ secrets.CHROME_STORE_EXTENSION_ID }}"
